<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор новостей | Стиль Фейгин Лайф</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --border: #2a2f3d;
      --text: #e4e7eb;
      --muted: #8b949e;
      --accent: #e63946;
      --accent-hover: #ff4d5a;
      --input-bg: #111318;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    h1 span {
      color: var(--accent);
    }

    .badge {
      background: rgba(230, 57, 70, 0.15);
      color: var(--accent);
      border: 1px solid rgba(230, 57, 70, 0.4);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .card {
      background-color: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="password"],
    input[type="text"],
    textarea,
    select {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.5;
    }

    .api-row {
      display: flex;
      gap: 10px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 600px) {
      .controls-grid {
        grid-template-columns: 1fr;
      }
      .api-row {
        flex-direction: column;
      }
    }

    button {
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #252a36;
      color: var(--text);
      padding: 10px 16px;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background-color: #323846;
    }

    .output-box {
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      min-height: 180px;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 0.98rem;
      color: #f1f3f5;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status {
      font-size: 0.8rem;
      color: #4ade80;
    }

    .error {
      color: #ff6b6b;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>ФЕЙГИН <span>ЛАЙФ</span> // АДАПТЕР НОВОСТЕЙ</h1>
    <div class="badge">AUTO-MODEL ENGINE</div>
  </header>

  <!-- Блок API ключа -->
  <div class="card">
    <label>
      <span>Gemini API Ключ (сохраняется локально в браузере)</span>
      <span id="keyStatus" class="status"></span>
    </label>
    <div class="api-row">
      <input type="password" id="apiKeyInput" placeholder="Вставьте ваш ключ AIzaSy...">
      <button class="btn-secondary" onclick="saveKey()">Сохранить ключ</button>
    </div>
  </div>

  <!-- Блок ввода новости и настроек -->
  <div class="card">
    <div>
      <label for="newsInput" style="margin-bottom: 8px;">Исходная новость или тезис</label>
      <textarea id="newsInput" placeholder="Вставьте сюда текст любой новости, заметки или сухой факт..."></textarea>
    </div>

    <div class="controls-grid">
      <div>
        <label for="toneSelect" style="margin-bottom: 8px;">Градус подачи</label>
        <select id="toneSelect">
          <option value="balanced">Классический стрим (Ирония + Аналитика)</option>
          <option value="hard">Жесткий сарказм и разгром (Максимальный накал)</option>
          <option value="legal">Юридический и геополитический разбор</option>
          <option value="telegram">Короткий пост для Telegram-канала</option>
        </select>
      </div>

      <div>
        <label for="lengthSelect" style="margin-bottom: 8px;">Формат / Объём</label>
        <select id="lengthSelect">
          <option value="medium">Средний (2–3 абзаца, как подводка в эфире)</option>
          <option value="short">Короткий (1 емкий абзац + вывод)</option>
          <option value="long">Развернутый монолог (с заголовком и финалом)</option>
        </select>
      </div>
    </div>

    <div id="errorBox" class="error"></div>

    <button id="generateBtn" onclick="generateText()">Переработать в стиле эфира</button>
  </div>

  <!-- Блок результата -->
  <div class="card">
    <div class="output-header">
      <label>Готовый текст</label>
      <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="copyResult()">Скопировать</button>
    </div>
    <div id="outputBox" class="output-box" style="color: var(--muted);">Здесь появится готовый текст...</div>
  </div>
</div>

<script>
  const apiKeyInput = document.getElementById('apiKeyInput');
  const keyStatus = document.getElementById('keyStatus');
  const errorBox = document.getElementById('errorBox');
  const outputBox = document.getElementById('outputBox');
  const generateBtn = document.getElementById('generateBtn');

  window.onload = () => {
    const savedKey = localStorage.getItem('gemini_api_key_feigin');
    if (savedKey) {
      apiKeyInput.value = savedKey;
      keyStatus.textContent = '✓ Ключ загружен';
    }
  };

  function saveKey() {
    const key = apiKeyInput.value.trim();
    if (!key) {
      showError('Введите API-ключ перед сохранением.');
      return;
    }
    localStorage.setItem('gemini_api_key_feigin', key);
    keyStatus.textContent = '✓ Ключ сохранён';
    hideError();
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  function hideError() {
    errorBox.style.display = 'none';
  }

  function copyResult() {
    const text = outputBox.innerText;
    if (!text || text === 'Здесь появится готовый текст...') return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = event.target;
      const oldText = btn.textContent;
      btn.textContent = 'Скопировано!';
      setTimeout(() => btn.textContent = oldText, 1500);
    });
  }

  // Функция автоматически находит актуальную рабочую модель через API
  async function getWorkingModel(apiKey) {
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
      const data = await res.json();
      if (data.models) {
        // Ищем любую модель flash, которая поддерживает генерацию текста
        const flashModel = data.models.find(m => m.name.includes('flash') && m.supportedGenerationMethods?.includes('generateContent'));
        if (flashModel) {
          // Возвращает имя модели без префикса "models/", если он есть
          return flashModel.name.replace('models/', '');
        }
      }
    } catch (e) {
      console.warn('Не удалось автоматически получить список моделей, используем резервную.');
    }
    return 'gemini-2.5-flash'; // Резервный вариант на крайний случай
  }

  async function generateText() {
    hideError();
    const apiKey = apiKeyInput.value.trim() || localStorage.getItem('gemini_api_key_feigin');
    const newsText = document.getElementById('newsInput').value.trim();
    const tone = document.getElementById('toneSelect').value;
    const length = document.getElementById('lengthSelect').value;

    if (!apiKey) {
      showError('Ошибка: Сначала вставьте и сохраните ваш Gemini API ключ.');
      return;
    }
    if (!newsText) {
      showError('Ошибка: Вставьте текст новости для обработки.');
      return;
    }

    generateBtn.disabled = true;
    generateBtn.textContent = 'Подбор модели и генерация...';
    outputBox.style.color = 'var(--muted)';
    outputBox.textContent = 'Ищу актуальную рабочую модель...';

    try {
      // Автоматически определяем актуальную модель на лету
      const modelName = await getWorkingModel(apiKey);
      
      outputBox.textContent = 'Анализирую новость и формирую подачу...';

      const toneInstructions = {
        balanced: 'Сбалансированный фирменный стиль: сочетание едкой иронии, политической публицистики и уверенной аналитики.',
        hard: 'Максимально жесткий сарказм, гротеск, высмеивание абсурда происходящего, эмоциональный накал.',
        legal: 'Акцент на правовую оценку, международное право, неизбежность юридической ответственности и системный кризис.',
        telegram: 'Формат острого, цепляющего поста для Telegram-канала без лишней воды, с сильным финальным акцентом.'
      };

      const lengthInstructions = {
        short: 'Объём: 1–2 коротких ёмких абзаца.',
        medium: 'Объём: 3–4 абзаца, как полноценная подводка к теме на стриме.',
        long: 'Объём: развёрнутый монолог (4–6 абзацев) с ярким заголовком в начале и фирменным призывом к аудитории в конце.'
      };

      const systemPrompt = `Ты — политический публицист, юрист и ведущий разговорных политических стримов в стилистике Марка Фейгина («Фейгин Лайф»).
Твоя задача — взять исходную новость и переписать её в живой, авторской устной или публицистической манере.

КЛЮЧЕВЫЕ ПРАВИЛА СТИЛЯ (БЕЗ ШАБЛОНОВ):
1. Никаких заезженных клише и повторения одних и тех же стартовых фраз каждый раз. Каждый раз заходи в тему органично, отталкиваясь от сути самой новости.
2. Интонация: уверенная, ироничная, слегка пафосная, с позиции человека, который видит ситуацию насквозь.
3. Используй живые разговорные связки («Смотрите, что происходит», «Ну вы вдумайтесь», «Абсолютно закономерная история», «И вот тут возникает главный вопрос»).
4. Оценивай событие не просто как факт, а как симптом системных процессов, тупика или абсурда власти.
5. ${toneInstructions[tone]}
6. ${lengthInstructions[length]}
7. Сохраняй все реальные факты, имена и цифры из исходной новости, не выдумывая несуществующих событий, но подавая их через авторскую призму.`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: systemPrompt }]
          },
          contents: [
            {
              parts: [{ text: `Переработай следующую новость:\n\n${newsText}` }]
            }
          ],
          generationConfig: {
            temperature: 0.85,
            topP: 0.95
          }
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || 'Ошибка при обращении к API');
      }

      const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!resultText) {
        throw new Error('Пустой ответ от модели.');
      }

      outputBox.style.color = '#f1f3f5';
      outputBox.textContent = resultText.trim();

    } catch (err) {
      outputBox.textContent = 'Не удалось сгенерировать текст.';
      showError('Ошибка: ' + err.message);
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = 'Переработать в стиле эфира';
    }
  }
</script>

</body>
</html>
